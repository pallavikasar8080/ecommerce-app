<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
      margin-top: 100px;
    }

    .box {
      background: white;
      display: inline-block;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    input {
      padding: 10px;
      width: 200px;
      margin: 10px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-btn {
      background: #007bff;
      color: white;
    }

    .signup-btn {
      background: green;
      color: white;
    }

    .forgot-btn {
      background: orange;
      color: white;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🔐 Login</h2>

  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>

  <button class="login-btn" onclick="login()">Login</button>
  <button class="signup-btn" onclick="signup()">Signup</button>
  <br><br>
  <button class="forgot-btn" onclick="forgotPassword()">Forgot Password</button>
</div>

<script>

function login() {
  if (!email.value || !password.value) {
    return alert("Please enter email & password");
  }

  fetch("http://localhost:5000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem("user", email.value);
      alert("Login successful ✅");
      window.location.href = "index.html";
    } else {
      alert(data.message || "Invalid login ❌");
    }
  })
  .catch(() => alert("Server error"));
}

function signup() {
  if (!email.value || !password.value) {
    return alert("Please enter email & password");
  }

  fetch("http://localhost:5000/signup", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  })
  .then(res => res.text())
  .then(msg => {
    alert(msg);
  })
  .catch(() => alert("Server error"));
}

function forgotPassword() {
  const userEmail = prompt("Enter your email");

  if (!userEmail) return;

  fetch("http://localhost:5000/forgot", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email: userEmail })
  })
  .then(res => res.text())
  .then(alert)
  .catch(() => alert("Server error"));
}

</script>

</body>
</html>
